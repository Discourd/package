<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPA Distribution Tool</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --sub-text: #8e8e93;
      --primary: #007aff;
      --border: #e5e5ea;
      --success: #34c759;
      --secondary: #5856d6;
      --danger: #ff3b30;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 480px; }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px 0; text-align: center; }
    p.subtitle { color: var(--sub-text); font-size: 14px; text-align: center; margin: 0 0 24px 0; }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      background-color: #fafafa;
    }

    .drop-icon { font-size: 40px; margin-bottom: 12px; display: block; }
    .drop-text { font-size: 15px; font-weight: 600; }
    .drop-hint { font-size: 12px; color: var(--sub-text); margin-top: 4px; }
    input[type="file"] { display: none; }

    .file-info {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: var(--bg);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      word-break: break-all;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:disabled { background: #c7c7cc; cursor: not-allowed; }

    .progress-container { display: none; margin-top: 24px; }
    .progress-bar-bg { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }
    .status-text { font-size: 13px; color: var(--sub-text); margin-top: 8px; text-align: center; font-weight: 500; }

    .result-container {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .app-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 12px; }
    .info-group { background: var(--bg); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
    .info-label { color: var(--sub-text); }
    .info-value { font-weight: 600; }

    .action-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .install-btn { background: var(--success); box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3); }
    .provision-btn { background: var(--secondary); box-shadow: 0 4px 12px rgba(88, 86, 214, 0.3); }

    .error-msg {
      display: none;
      color: var(--danger);
      background: rgba(255, 59, 48, 0.1);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>IPA OTA 配信ツール</h1>
    <p class="subtitle">iOSアプリのインストール & 署名書発行</p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('ipaFile').click()">
      <span class="drop-icon">📦</span>
      <div class="drop-text">IPA ファイルを選択</div>
      <div class="drop-hint">またはここにドラッグ＆ドロップ</div>
      <input type="file" id="ipaFile" accept=".ipa" onchange="handleFileSelect(event)">
    </div>

    <div class="file-info" id="fileInfo"></div>

    <button class="btn" id="uploadBtn" onclick="uploadIpa()" disabled>アップロード & 解析</button>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText">準備中...</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-container" id="resultContainer">
      <div class="app-title" id="resAppName">App Name</div>
      
      <div class="info-group">
        <div class="info-row">
          <span class="info-label">Bundle ID</span>
          <span class="info-value" id="resBundleId">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Version</span>
          <span class="info-value" id="resVersion">-</span>
        </div>
      </div>

      <a id="installLink" href="#" class="action-btn install-btn">iOS端末でインストール</a>
      <a id="provisionLink" href="#" class="action-btn provision-btn" style="display: none;" download>署名書 (.mobileprovision) を取得</a>
    </div>
  </div>
</div>

<script>
  let selectedFile = null;

  function handleFileSelect(e) {
    const files = e.target.files || e.dataTransfer.files;
    if (files.length > 0) {
      selectedFile = files[0];
      showFileInfo(selectedFile.name);
    }
  }

  function showFileInfo(name) {
    document.getElementById('fileInfo').innerText = `選択中: ${name}`;
    document.getElementById('fileInfo').style.display = 'block';
    document.getElementById('uploadBtn').disabled = false;
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('resultContainer').style.display = 'none';
  }

  function uploadIpa() {
    if (!selectedFile) return;

    const btn = document.getElementById('uploadBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const provisionLink = document.getElementById('provisionLink');

    btn.disabled = true;
    progressContainer.style.display = 'block';
    resultContainer.style.display = 'none';

    const formData = new FormData();
    formData.append('ipa', selectedFile);

    const xhr = new XMLHttpRequest();
    let uploadUrl = window.location.protocol.startsWith('http') ? `${window.location.origin}/upload` : '/upload';

    xhr.open('POST', uploadUrl, true);

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        progressBar.style.width = percent + '%';
        statusText.innerText = percent < 100 ? `アップロード中... ${percent}%` : '解析 & 署名書抽出中...';
      }
    };

    xhr.onload = function() {
      btn.disabled = false;
      if (xhr.status === 200) {
        const res = JSON.parse(xhr.responseText);
        if (res.success) {
          statusText.innerText = '処理完了！';
          document.getElementById('resAppName').innerText = res.appName;
          document.getElementById('resBundleId').innerText = res.bundleId;
          document.getElementById('resVersion').innerText = res.version;
          document.getElementById('installLink').href = res.installUrl;

          if (res.provisionUrl) {
            provisionLink.href = res.provisionUrl;
            provisionLink.style.display = 'block';
          } else {
            provisionLink.style.display = 'none';
          }

          resultContainer.style.display = 'block';
        }
      } else {
        document.getElementById('errorMsg').innerText = `エラー: ${xhr.responseText}`;
        document.getElementById('errorMsg').style.display = 'block';
      }
    };

    xhr.send(formData);
  }
</script>
</body>
</html>
